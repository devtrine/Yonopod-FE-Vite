<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video-js.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .video-js-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .video-js {
      width: 100% !important;
      height: 100% !important;
      background-color: #000;
    }
    /* Google Drive styled video.js control bar */
    .video-js .vjs-control-bar {
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.4) 60%, transparent 100%);
      height: 4em;
      align-items: center;
      padding: 0 12px;
    }
    .video-js .vjs-big-play-button {
      background-color: rgba(28, 63, 196, 0.9);
      border: none;
      border-radius: 50%;
      width: 68px;
      height: 68px;
      line-height: 68px;
      font-size: 32px;
      margin-left: -34px;
      margin-top: -34px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .video-js .vjs-big-play-button:hover {
      background-color: rgba(28, 63, 196, 1);
      transform: scale(1.08);
    }
    .video-js .vjs-slider {
      background-color: rgba(255, 255, 255, 0.25);
    }
    .video-js .vjs-load-progress {
      background-color: rgba(255, 255, 255, 0.4);
    }
    .video-js .vjs-play-progress {
      background-color: #3b82f6;
    }
    .video-js .vjs-play-progress:before {
      color: #fff;
    }
    #error-message {
      display: none;
      color: #ef4444;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      max-width: 80%;
    }
    .loader {
      display: none;
      position: absolute;
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 10;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="video-js-container">
    <div id="loader" class="loader"></div>
    <div id="error-message">Unable to load video stream. Please check file format or download instead.</div>
    <video
      id="main-video-player"
      class="video-js vjs-default-skin vjs-big-play-centered"
      controls
      preload="auto"
      playsinline
    >
      <p class="vjs-no-js">
        To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video.
      </p>
    </video>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video.min.js"></script>
  <script>
    (function () {
      var player = null;
      var loaderEl = document.getElementById("loader");
      var errorEl = document.getElementById("error-message");
      var videoEl = document.getElementById("main-video-player");

      function getUrlParams() {
        var params = new URLSearchParams(window.location.search);
        return {
          src: params.get("src"),
          type: params.get("type") || "video/mp4",
          title: params.get("title") || ""
        };
      }

      function initPlayer(sourceUrl, mimeType) {
        if (!sourceUrl) {
          if (errorEl) {
            errorEl.style.display = "block";
            errorEl.innerText = "No video source provided.";
          }
          return;
        }

        if (errorEl) errorEl.style.display = "none";
        if (loaderEl) loaderEl.style.display = "block";

        if (player) {
          player.src({ src: sourceUrl, type: mimeType });
          player.load();
          return;
        }

        player = videojs(videoEl, {
          controls: true,
          autoplay: false,
          preload: "auto",
          fluid: false,
          playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 2],
          responsive: true,
          sources: [
            {
              src: sourceUrl,
              type: mimeType
            }
          ]
        });

        player.on("loadeddata", function () {
          if (loaderEl) loaderEl.style.display = "none";
        });

        player.on("waiting", function () {
          if (loaderEl) loaderEl.style.display = "block";
        });

        player.on("canplay", function () {
          if (loaderEl) loaderEl.style.display = "none";
        });

        player.on("playing", function () {
          if (loaderEl) loaderEl.style.display = "none";
        });

        player.on("error", function () {
          if (loaderEl) loaderEl.style.display = "none";
          var error = player.error();
          if (errorEl) {
            errorEl.style.display = "block";
            errorEl.innerText = "Video cannot be played: " + (error ? error.message : "Codec or source error");
          }
        });
      }

      var initial = getUrlParams();
      if (initial.src) {
        initPlayer(initial.src, initial.type);
      }

      window.addEventListener("message", function (event) {
        if (event.data && event.data.type === "SET_SOURCE") {
          initPlayer(event.data.src, event.data.mimeType || "video/mp4");
        }
      });
    })();
  </script>
</body>
</html>
